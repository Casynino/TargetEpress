<body>
<script type="module">
/*
 * The homepage hero, as a 3D scene rendered into a looping film (owner, 16 Nov
 * 2026: "do what you did on the ZELab sign-in — realistic, moving, the best").
 * Not shipped to the site: scripts/hero-film/render.mjs opens this page, calls
 * renderAt(t) for every frame and saves them; the site plays the finished film.
 *
 * The earth at night from high over the Indian Ocean — real NASA imagery (the
 * city lights and the cloud cover, public domain, via the three.js examples),
 * its coasts traced in light — Target's red route from Guangzhou and Hong Kong
 * into Dar es Salaam with light running along it, and a cargo airliner in
 * Target's livery flying through the frame. Target's colours: navy #182A48,
 * red #D81E2A, white.
 *
 * Everything periodic divides the loop (24 s) so it joins without a seam.
 */
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
const ORIENT = params.get("o") === "portrait" ? "portrait" : "landscape";
// Rendered a little under full HD and scaled up by the page: a film a phone can download.
const W = ORIENT === "portrait" ? 780 : 1600;
const H = ORIENT === "portrait" ? 1560 : 900; // a phone is about twice as tall as it is wide
const LOOP = 24;
const RED = 0xd81e2a;
const R = 10;
const TEX = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(ORIENT === "portrait" ? 58 : 34, W / H, 0.1, 500);
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const loader = new THREE.TextureLoader();
const load = async (name, srgb = true) => { const t = await loader.loadAsync(TEX + name); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

/* ── the sky: navy overhead, the last of the sun burning red-orange low on the right ── */
{
  const c = document.createElement("canvas"); c.width = 1024; c.height = 1024; const g = c.getContext("2d");
  const v = g.createLinearGradient(0, 0, 0, 1024);
  v.addColorStop(0, "#050b18"); v.addColorStop(0.4, "#0f1e38"); v.addColorStop(0.7, "#1e3358"); v.addColorStop(1, "#22375c");
  g.fillStyle = v; g.fillRect(0, 0, 1024, 1024);
  const glow = g.createRadialGradient(940, 560, 10, 940, 560, 640);
  glow.addColorStop(0, "rgba(255,170,110,0.75)"); glow.addColorStop(0.25, "rgba(240,90,70,0.35)"); glow.addColorStop(0.6, "rgba(216,30,42,0.12)"); glow.addColorStop(1, "rgba(216,30,42,0)");
  g.fillStyle = glow; g.fillRect(0, 0, 1024, 1024);
  const rnd = mulberry(7);
  for (let i = 0; i < 320; i++) { const x = rnd() * 1024, y = rnd() * 460; g.fillStyle = `rgba(255,255,255,${0.12 + rnd() * 0.6})`; g.fillRect(x, y, 1.3, 1.3); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}

/* ── the earth ── */
const [dayMap, lightsImg, cloudMap, specMap] = await Promise.all([load("earth_atmos_4096.jpg"), load("earth_lights_2048.png"), load("earth_clouds_2048.png"), load("earth_specular_2048.jpg", false)]);
const land = await (await fetch("/geo/land-110m.json")).json();

// The night: NASA's city lights, and the coasts traced in pale blue light.
const nightCanvas = (() => {
  const TW = 4096, TH = 2048, c = document.createElement("canvas"); c.width = TW; c.height = TH; const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, TW, TH);
  g.drawImage(lightsImg.image, 0, 0, TW, TH);
  const ex = (lon) => ((lon + 180) / 360) * TW, ey = (lat) => ((90 - lat) / 180) * TH;
  g.beginPath();
  for (const f of land.features) {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) { ring.forEach(([lon, lat], i) => (i ? g.lineTo(ex(lon), ey(lat)) : g.moveTo(ex(lon), ey(lat)))); g.closePath(); }
  }
  g.save(); g.shadowColor = "rgba(120,190,255,1)"; g.shadowBlur = 8; g.strokeStyle = "rgba(140,200,255,0.75)"; g.lineWidth = 1.6; g.stroke(); g.restore();
  return c;
})();
const nightMap = new THREE.CanvasTexture(nightCanvas); nightMap.colorSpace = THREE.SRGBColorSpace; nightMap.anisotropy = 8;

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(R, 192, 128),
  new THREE.MeshStandardMaterial({
    map: dayMap, color: 0x3c5480, // the day picture, dimmed and cooled to Target's night navy
    emissiveMap: nightMap, emissive: 0xffd6a8, emissiveIntensity: 1.25,
    // matte: a shiny sea threw the low sun back as a hard square of light
    roughness: 1, metalness: 0.0, envMapIntensity: 0,
  })
);
scene.add(earth);

const cloudsLayer = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.008, 160, 110),
  new THREE.MeshStandardMaterial({ alphaMap: cloudMap, color: 0x9fb2cf, transparent: true, opacity: 0.16, depthWrite: false, envMapIntensity: 0 })
);
scene.add(cloudsLayer);

// the air: a soft blue rim where the earth meets the sky
const haze = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.004, 128, 96),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { c: { value: new THREE.Color(0x5f9cff) } },
    vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix*normal); vec4 p = modelViewMatrix*vec4(position,1.); vP = p.xyz; gl_Position = projectionMatrix*p; }`,
    fragmentShader: `uniform vec3 c; varying vec3 vN; varying vec3 vP; void main(){ float f = 1.0 - max(0.0, dot(vN, normalize(-vP))); gl_FragColor = vec4(c, pow(f, 5.0) * 0.6); }`,
  })
);
scene.add(haze);
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.03, 96, 64),
  new THREE.ShaderMaterial({
    transparent: true, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { c: { value: new THREE.Color(0x6fa8ff) } },
    vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix*normal); vec4 p = modelViewMatrix*vec4(position,1.); vP = p.xyz; gl_Position = projectionMatrix*p; }`,
    fragmentShader: `uniform vec3 c; varying vec3 vN; varying vec3 vP; void main(){ float i = pow(max(0.0, 0.66 - dot(vN, normalize(-vP))), 4.0); gl_FragColor = vec4(c, clamp(i*3.0,0.,0.55)); }`,
  })
);
scene.add(atmosphere);

/* ── places ── */
function at(lon, lat, r = R) {
  const theta = ((90 - lat) * Math.PI) / 180, phi = ((lon + 180) * Math.PI) / 180;
  return new THREE.Vector3(-r * Math.cos(phi) * Math.sin(theta), r * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta));
}
const GZ = at(113.26, 23.13), HK = at(114.17, 22.32), DAR = at(39.28, -6.79);

/* ── the routes, low over the earth, in Target red ── */
function arc(a, b, lift) {
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const t = i / 120;
    const p = a.clone().normalize().lerp(b.clone().normalize(), t).normalize();
    pts.push(p.multiplyScalar(R * (1.006 + lift * Math.sin(Math.PI * t))));
  }
  return new THREE.CatmullRomCurve3(pts);
}
const routes = [arc(GZ, DAR, 0.07), arc(HK, DAR, 0.05)];
const glowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.2, "rgba(255,210,200,0.85)"); r.addColorStop(1, "rgba(255,60,60,0)");
  g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
})();
for (const [i, curve] of routes.entries()) {
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 240, i ? 0.016 : 0.024, 8), new THREE.MeshBasicMaterial({ color: 0xff4a54 })));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 240, i ? 0.06 : 0.08, 10), new THREE.MeshBasicMaterial({ color: RED, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false })));
}
const pulses = [];
for (const [ri, curve] of routes.entries()) for (let k = 0; k < 3; k++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.setScalar(ri ? 0.32 : 0.42); scene.add(s); pulses.push({ s, curve, k, ri });
}
const ends = [];
for (const [p, col, big] of [[GZ, 0xffd7a0, false], [HK, 0xffd7a0, false], [DAR, 0xff4d57, true]]) {
  const dot = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  dot.position.copy(p.clone().multiplyScalar(1.004)); dot.scale.setScalar(big ? 0.9 : 0.55); scene.add(dot);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1.0, 64), new THREE.MeshBasicMaterial({ color: col, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  ring.position.copy(p.clone().multiplyScalar(1.003)); ring.lookAt(p.clone().multiplyScalar(2)); scene.add(ring);
  ends.push({ ring, big });
}

/* ── light: a cool fill, and the low sun beyond the horizon on the right ── */
scene.add(new THREE.HemisphereLight(0x9fbcff, 0x0b1426, 0.55));
const sun = new THREE.DirectionalLight(0xffb48a, 1.6);
scene.add(sun);

/* ── the camera: high over the Indian Ocean, looking north to the curve of the earth ── */
// High over the ocean south of India, looking at a point north of the route's
// middle: Africa on the left, China on the right, the curve of the earth high in
// the frame and sky above it, as in the owner's picture.
const C = at(74, -10).normalize();
const north = new THREE.Vector3(0, 1, 0).sub(C.clone().multiplyScalar(C.y)).normalize();
const east = new THREE.Vector3().crossVectors(north, C).multiplyScalar(-1).normalize();
// On a phone the camera stands further back, so the whole lane fits the narrow
// frame, with the sky and the aircraft above the curve of the earth.
const UP = north.clone();
const CAM = ORIENT === "portrait"
  ? { pos: at(73, -22).normalize().multiplyScalar(R * 3.0), look: at(74, 12) }
  : { pos: C.clone().multiplyScalar(R * 2.42), look: at(76, 18) };
camera.up.copy(UP);
sun.position.copy(C.clone().multiplyScalar(-6).add(north.clone().multiplyScalar(40)).add(east.clone().multiplyScalar(60)));

/* ── the aircraft, in Target's livery: a smooth body, swept wings, two engines, a red tail ── */
const logoTex = await loader.loadAsync("/brand/target-express-logo.png");
logoTex.colorSpace = THREE.SRGBColorSpace; logoTex.anisotropy = 8;
function airliner() {
  const g = new THREE.Group();
  const paint = new THREE.MeshPhysicalMaterial({ color: 0xd9dfe7, metalness: 0.1, roughness: 0.28, clearcoat: 0.5, clearcoatRoughness: 0.25, envMap, envMapIntensity: 0.8 });
  const wingM = new THREE.MeshPhysicalMaterial({ color: 0xb4bcc8, metalness: 0.15, roughness: 0.45, clearcoat: 0.2, envMap, envMapIntensity: 0.45 });
  const redM = new THREE.MeshPhysicalMaterial({ color: RED, metalness: 0.1, roughness: 0.3, clearcoat: 0.8, envMap, envMapIntensity: 1.0 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x141b27, metalness: 0.5, roughness: 0.3, envMap });

  // body: one smooth profile turned on a lathe, nose round, tail tapering
  const prof = [];
  const L = 13, rMax = 0.62;
  for (let i = 0; i <= 60; i++) {
    const y = (i / 60) * L; let r;
    if (y < 1.9) r = rMax * Math.sqrt(1 - Math.pow(1 - y / 1.9, 2));
    else if (y < 9.6) r = rMax;
    else r = rMax - (rMax - 0.14) * Math.pow((y - 9.6) / (L - 9.6), 1.3);
    prof.push(new THREE.Vector2(Math.max(r, 0.001), y));
  }
  const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), paint);
  body.rotation.z = Math.PI / 2; // lathe +Y becomes -X: the nose (y = 0) ends up at +X once shifted
  body.position.x = L / 2;
  g.add(body);
  // the tail cone lifts: a small wedge to suggest the upswept rear
  // cockpit glass
  const glass = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 12, 0, Math.PI * 2, 0, Math.PI / 3), dark);
  glass.scale.set(1.3, 0.55, 1.05); glass.position.set(L / 2 - 1.0, 0.34, 0); glass.rotation.z = -0.9; g.add(glass);

  // a swept wing with real thickness, then its twin
  const ws = new THREE.Shape(); ws.moveTo(0.9, 0); ws.lineTo(-1.5, 0); ws.lineTo(-4.1, 7.0); ws.lineTo(-3.45, 7.0); ws.closePath();
  const wGeo = new THREE.ExtrudeGeometry(ws, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 3 });
  const ts = new THREE.Shape(); ts.moveTo(0.3, 0); ts.lineTo(-1.2, 0); ts.lineTo(-2.2, 2.7); ts.lineTo(-1.6, 2.7); ts.closePath();
  const tGeo = new THREE.ExtrudeGeometry(ts, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2 });
  // nacelle: a lathe too, wide at the intake
  const np = []; for (let i = 0; i <= 24; i++) { const y = (i / 24) * 2.0; const r = 0.36 - 0.1 * Math.pow(y / 2.0, 1.6) + (y < 0.1 ? -0.05 : 0); np.push(new THREE.Vector2(r, y)); }
  const nGeo = new THREE.LatheGeometry(np, 32);
  for (const s of [1, -1]) {
    const w = new THREE.Mesh(wGeo, wingM); w.rotation.set(s * -Math.PI / 2 + s * 0.07, 0, 0); w.position.set(0.9, -0.28, s * 0.06); g.add(w);
    const tail = new THREE.Mesh(tGeo, wingM); tail.rotation.set(s * -Math.PI / 2 + s * 0.05, 0, 0); tail.position.set(-6.0, 0.22, s * 0.04); g.add(tail);
    const n = new THREE.Mesh(nGeo, paint); n.rotation.z = Math.PI / 2; n.position.set(1.0, -0.62, s * 2.25); g.add(n);
    const fan = new THREE.Mesh(new THREE.CircleGeometry(0.31, 32), dark); fan.rotation.y = Math.PI / 2; fan.position.set(1.01, -0.62, s * 2.25); g.add(fan);
    const pylon = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.28, 0.08), wingM); pylon.position.set(0.4, -0.42, s * 2.25); g.add(pylon);
  }
  // the fin, in Target red
  const fs = new THREE.Shape(); fs.moveTo(0.6, 0); fs.lineTo(-1.7, 0); fs.lineTo(-2.9, 2.9); fs.lineTo(-1.9, 2.9); fs.closePath();
  const fin = new THREE.Mesh(new THREE.ExtrudeGeometry(fs, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 }), redM);
  fin.position.set(-5.4, 0.42, -0.05); g.add(fin);
  // the logo along the cabin, both sides, and a row of windows
  for (const s of [1, -1]) {
    const d = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.66), new THREE.MeshStandardMaterial({ map: logoTex, transparent: true, roughness: 0.35, metalness: 0.05, envMap, envMapIntensity: 0.6 }));
    d.position.set(-0.9, 0.02, s * 0.628); if (s < 0) d.rotation.y = Math.PI; g.add(d);
    for (let i = 0; i < 30; i++) { const x = 4.6 - i * 0.32; if (x < 1.4 && x > -3.2) continue; const win = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.15, 0.02), dark); win.position.set(x, 0.3, s * 0.6); g.add(win); }
  }
  return g;
}
const plane = airliner();
plane.scale.setScalar(ORIENT === "portrait" ? 0.42 : 0.5); // flown in front of the earth
const planeKey = new THREE.DirectionalLight(0xffffff, 0.9); planeKey.position.set(-6, 10, 14);
const planeRim = new THREE.DirectionalLight(0xffb08a, 0.55); planeRim.position.set(14, 4, -10);
camera.add(plane, planeKey, planeRim);
planeKey.target = plane; planeRim.target = plane;
scene.add(camera);

/* ── a container ship on the ocean and a Target truck on a coastal road,
      in front of the earth as in the owner's picture ── */
const shipM = {
  hull: new THREE.MeshStandardMaterial({ color: 0x182a48, roughness: 0.5, metalness: 0.2, envMap, envMapIntensity: 0.5 }),
  belly: new THREE.MeshStandardMaterial({ color: RED, roughness: 0.6, envMap, envMapIntensity: 0.4 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe8ecf1, roughness: 0.45, envMap, envMapIntensity: 0.6 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x0f1622, roughness: 0.4 }),
};
const BOX_COLOURS = [RED, 0x182a48, 0xe9edf2, 0x2f6fb5, 0x9d1c24, 0xc7ced8, 0x36507a];
function ship() {
  const g = new THREE.Group();
  const plan = new THREE.Shape();
  plan.moveTo(-4, -0.68); plan.lineTo(2.9, -0.68); plan.quadraticCurveTo(4.3, -0.5, 4.8, 0); plan.quadraticCurveTo(4.3, 0.5, 2.9, 0.68); plan.lineTo(-4, 0.68); plan.closePath();
  const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(plan, { depth: 0.7, bevelEnabled: false }), shipM.hull);
  hull.rotation.x = -Math.PI / 2; hull.position.y = -0.2; g.add(hull);
  const belly = new THREE.Mesh(new THREE.ExtrudeGeometry(plan, { depth: 0.22, bevelEnabled: false }), shipM.belly);
  belly.rotation.x = -Math.PI / 2; belly.position.y = -0.42; belly.scale.set(0.99, 0.97, 1); g.add(belly);
  const rnd = mulberry(11);
  for (let i = 0; i < 11; i++) for (let j = -2; j <= 2; j++) {
    const tiers = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < tiers; k++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.26, 0.24), new THREE.MeshStandardMaterial({ color: BOX_COLOURS[Math.floor(rnd() * BOX_COLOURS.length)], roughness: 0.6, envMap, envMapIntensity: 0.35 }));
      b.position.set(-2.4 + i * 0.6, 0.63 + k * 0.27, j * 0.25); g.add(b);
    }
  }
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.25, 1.2), shipM.white); bridge.position.set(-3.35, 1.1, 0); g.add(bridge);
  const band = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.12, 1.22), shipM.dark); band.position.set(-3.35, 1.55, 0); g.add(band);
  // the wake: white water spreading behind
  const wc = document.createElement("canvas"); wc.width = 256; wc.height = 64; const wg = wc.getContext("2d");
  wg.filter = "blur(5px)";
  const grd = wg.createLinearGradient(0, 0, 256, 0); grd.addColorStop(0, "rgba(255,255,255,0)"); grd.addColorStop(1, "rgba(255,255,255,0.7)");
  wg.fillStyle = grd; wg.beginPath(); wg.moveTo(0, 6); wg.lineTo(250, 26); wg.lineTo(250, 38); wg.lineTo(0, 58); wg.closePath(); wg.fill();
  const wake = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(wc), transparent: true, depthWrite: false, opacity: 0.32 }));
  wake.rotation.x = -Math.PI / 2; wake.position.set(-6.0, -0.3, 0); g.add(wake);
  return g;
}
const shipG = ship();
shipG.scale.setScalar(ORIENT === "portrait" ? 0.34 : 0.42);
camera.add(shipG);

const truckLogo = logoTex;
function truck() {
  const g = new THREE.Group();
  const navy = new THREE.MeshStandardMaterial({ color: 0x182a48, roughness: 0.45, metalness: 0.2, envMap, envMapIntensity: 0.6 });
  const white = new THREE.MeshPhysicalMaterial({ color: 0xeef1f5, roughness: 0.3, clearcoat: 0.6, envMap, envMapIntensity: 0.8 });
  const black = new THREE.MeshStandardMaterial({ color: 0x0c0f14, roughness: 0.8 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1b2a3f, roughness: 0.15, metalness: 0.6, envMap, envMapIntensity: 1 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.5, 1.3), navy); box.position.set(-0.9, 1.15, 0); g.add(box);
  for (const s of [1, -1]) {
    const d = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.18), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
    d.position.set(-0.9, 1.15, s * 0.66); if (s < 0) d.rotation.y = Math.PI; g.add(d);
    const l = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 1.14), new THREE.MeshStandardMaterial({ map: truckLogo, transparent: true, roughness: 0.4 }));
    l.position.set(-0.9, 1.15, s * 0.665); if (s < 0) l.rotation.y = Math.PI; g.add(l);
  }
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.35, 1.25), white); cab.position.set(1.85, 0.95, 0); g.add(cab);
  const ws = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.5, 1.1), glass); ws.position.set(2.42, 1.25, 0); g.add(ws);
  for (const x of [-2.5, -1.9, 0.6, 1.9]) for (const s of [1, -1]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.22, 20), black); w.rotation.x = Math.PI / 2; w.position.set(x, 0.3, s * 0.55); g.add(w);
  }
  // headlights
  for (const s of [1, -1]) { const h = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xfff2d6, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); h.scale.setScalar(0.7); h.position.set(2.5, 0.55, s * 0.45); g.add(h); }
  return g;
}
const truckG = truck();
truckG.scale.setScalar(ORIENT === "portrait" ? 0.24 : 0.26);
camera.add(truckG);

// the coast it drives on: a dark green headland in the corner, the road curving across it
const ROAD = ORIENT === "portrait"
  ? new THREE.CatmullRomCurve3([new THREE.Vector3(6.5, -5.2, -15), new THREE.Vector3(3.2, -4.6, -15), new THREE.Vector3(0.4, -5.0, -15), new THREE.Vector3(-2.4, -6.0, -15), new THREE.Vector3(-6.5, -7.6, -15)])
  : new THREE.CatmullRomCurve3([new THREE.Vector3(12.5, -2.7, -15), new THREE.Vector3(9.6, -2.5, -15), new THREE.Vector3(7.0, -3.0, -15), new THREE.Vector3(4.6, -3.9, -15), new THREE.Vector3(2.0, -5.2, -15)]);
{
  const landShape = new THREE.Shape();
  const pts = ROAD.getPoints(40);
  landShape.moveTo(pts[0].x + 4, pts[0].y + 0.9);
  for (const p of pts) landShape.lineTo(p.x, p.y + 0.9);
  landShape.lineTo(pts[pts.length - 1].x - 4, pts[pts.length - 1].y - 4); landShape.lineTo(pts[0].x + 4, pts[pts.length - 1].y - 4); landShape.closePath();
  // dark green hillside: tree crowns, the odd house light, shading darker downhill
  const lc = document.createElement("canvas"); lc.width = lc.height = 512; const lg = lc.getContext("2d"); const lr = mulberry(23);
  lg.fillStyle = "#16352b"; lg.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) { const x = lr() * 512, y = lr() * 512, r = 4 + lr() * 9; lg.fillStyle = `rgba(${10 + lr() * 25},${45 + lr() * 45},${30 + lr() * 25},0.9)`; lg.beginPath(); lg.arc(x, y, r, 0, Math.PI * 2); lg.fill(); }
  for (let i = 0; i < 18; i++) { lg.fillStyle = `rgba(255,214,150,${0.5 + lr() * 0.5})`; lg.fillRect(lr() * 512, lr() * 512, 2.5, 2.5); }
  const landTex = new THREE.CanvasTexture(lc); landTex.colorSpace = THREE.SRGBColorSpace; landTex.wrapS = landTex.wrapT = THREE.RepeatWrapping; landTex.repeat.set(0.22, 0.22);
  const landM = new THREE.Mesh(new THREE.ShapeGeometry(landShape), new THREE.MeshStandardMaterial({ map: landTex, roughness: 0.95, envMapIntensity: 0 }));
  landM.position.z = -15.2; camera.add(landM);
  // the road itself, and its lights
  const road = new THREE.Mesh(new THREE.TubeGeometry(ROAD, 80, 0.32, 6), new THREE.MeshStandardMaterial({ color: 0x23262d, roughness: 0.9 }));
  road.scale.z = 0.05; road.position.z = -14.2; camera.add(road);
}
const trails = [];
for (const [dy, col] of [[0.18, 0xff3b30], [-0.18, 0xffe2b0]]) {
  const curve = new THREE.CatmullRomCurve3(ROAD.getPoints(60).map((p) => new THREE.Vector3(p.x, p.y + dy, -14.6)));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.022, 6), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
  const len = 100; tube.geometry.setDrawRange(0, 0);
  camera.add(tube); trails.push({ tube, curve });
}
for (const t of trails) t.tube.geometry.setDrawRange(0, Infinity);
const streaks = [];
for (let k = 0; k < 6; k++) {
  const sMesh = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: k % 2 ? 0xff4a3c : 0xffe9c4, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  sMesh.scale.set(0.9, 0.3, 1); camera.add(sMesh); streaks.push({ s: sMesh, k });
}

/* ── bloom: lights, route and pulses glow like a lens sees them ── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.5, 0.94));
composer.addPass(new OutputPass());

/* ── one frame at time t ── */
window.renderAt = (t) => {
  const u = (t % LOOP) / LOOP;
  // The camera holds still: the film is an animated WebP, and a frame that
  // only changes where something moves is a film a phone can download.
  camera.position.copy(CAM.pos);
  camera.lookAt(CAM.look);
  for (const p of pulses) {
    const v = (((t / 4 + p.k / 3 + p.ri * 0.17) % 1) + 1) % 1;
    p.s.position.copy(p.curve.getPoint(v));
    p.s.material.opacity = Math.sin(Math.PI * v);
  }
  for (const e of ends) { const v = (t % 3) / 3; e.ring.scale.setScalar((e.big ? 0.25 : 0.15) + v * (e.big ? 1.1 : 0.7)); e.ring.material.opacity = 0.9 * (1 - v); }
  // the aircraft: out of the distance over the earth, then past us on the right,
  // every 12 s — it never crosses the words on the left of the page
  const pv = (t % 24) / 24; // one unhurried crossing per loop
  const e = pv * pv * (3 - 2 * pv); // smooth in and out
  // it climbs out from behind the curve of the earth, grows as it nears, and
  // passes out of the top-right corner
  const from = ORIENT === "portrait" ? new THREE.Vector3(1.5, 0.6, -50) : new THREE.Vector3(5, 0.2, -52);
  const to = ORIENT === "portrait" ? new THREE.Vector3(9.5, 10, -9) : new THREE.Vector3(18, 7.2, -9);
  plane.position.copy(from).lerp(to, Math.pow(pv, 1.8));
  plane.rotation.set(0, 0, 0);
  plane.rotateY(-0.72 + e * 0.15); // nose to the right and towards us
  plane.rotateX(0.18);             // banking into the turn
  plane.rotateZ(0.06);
  // the ship sails a little way and back over the loop, rising and falling on the swell
  shipG.position.set((ORIENT === "portrait" ? -0.6 : 1.2) + Math.sin(u * Math.PI * 2) * 0.5, (ORIENT === "portrait" ? -3.6 : -2.1) + Math.sin(t * Math.PI / 2) * 0.03, -15);
  shipG.rotation.set(0.55, Math.PI * 0.92, 0.0);
  shipG.rotateZ(Math.sin(t * Math.PI / 2) * 0.012);
  // the truck drives the road every 8 s, right to left
  const tv = (t % 8) / 8;
  const tp = ROAD.getPointAt(tv), tn = ROAD.getTangentAt(tv);
  truckG.position.set(tp.x, tp.y + 0.05, -14.1);
  truckG.rotation.set(0.25, 0, Math.atan2(-tn.y, -tn.x));
  truckG.rotateY(Math.PI);
  for (const st of streaks) { const v = ((t / 2 + st.k / 6) % 1); const p = ROAD.getPointAt(1 - v); st.s.position.set(p.x, p.y + (st.k % 2 ? 0.18 : -0.18), -14.5); st.s.material.opacity = Math.sin(Math.PI * v); }
  composer.render();
};
window.renderAt(3);
window.ready = true;
</script>
